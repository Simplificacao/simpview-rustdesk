name: Build SIMP View - Android

# APK do SIMP View para celulares e coletores (18/11/2026): mesmo servidor e
# chave da versão Windows (remote.simplificacao.com), nome "SIMP View",
# identificador próprio (não colide com um RustDesk instalado) e assinatura
# nossa (secrets ANDROID_*; a chave fica em ~/.simpview/android-assinatura.jks
# na máquina de build -- trocar a chave impede atualizar por cima).
# Distribuição só pelo link do SIMP View (sem Play Store).

on:
  workflow_dispatch:
  push:
    branches: [simpview-android]
    paths: [".github/workflows/build-simplificacao-android.yml"]

env:
  RUST_VERSION: "1.75"
  CARGO_NDK_VERSION: "3.1.2"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VERSION: "1.4.8"
  NDK_VERSION: "r28c"
  APP_ID: "br.com.simplificacao.simpview"
  APP_LABEL: "SIMP View"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-android:
    needs: [generate-bridge]
    name: SIMP View android ${{ matrix.job.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { arch: arm64, target: aarch64-linux-android, abi: arm64-v8a, platform: android-arm64, ndk: ndk_arm64.sh, libcxx: aarch64-linux-android }
          - { arch: armv7, target: armv7-linux-androideabi, abi: armeabi-v7a, platform: android-arm, ndk: ndk_arm.sh, libcxx: arm-linux-androideabi }
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        # 18/11: travou 1 h duas vezes aqui (download do apt sem fim). Agora:
        # tempo limite por tentativa, retentativa do apt e até 3 voltas.
        timeout-minutes: 25
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          APT="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Dpkg::Use-Pty=0"
          PKGS="clang cmake curl gcc-multilib git g++ g++-multilib libayatana-appindicator3-dev \
               libasound2-dev libc6-dev libclang-dev libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
               libgtk-3-dev libpam0g-dev libpulse-dev libva-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
               libxdo-dev libxfixes-dev llvm-dev nasm ninja-build openjdk-17-jdk-headless pkg-config tree wget"
          for t in 1 2 3; do
            if timeout 420 sudo apt-get $APT update && timeout 600 sudo -E apt-get $APT install -y --no-install-recommends $PKGS; then exit 0; fi
            echo "::warning::instalação dos pacotes falhou/travou (tentativa $t)"; sleep 20
          done
          exit 1

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Configure custom server & app name (SIMP View)
        shell: bash
        run: |
          CONFIG=libs/hbb_common/src/config.rs
          SERVER=remote.simplificacao.com
          PUBKEY='ZU0225ZMbqCTlUGyiu4v1ScTOZIpMklBvIqfo3ltXJw='
          APPNAME='SimpView'
          sed -i "s|rs-ny\.rustdesk\.com|${SERVER}|g" "$CONFIG"
          sed -i "s|OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=|${PUBKEY}|g" "$CONFIG"
          sed -i "s|APP_NAME: RwLock<String> = RwLock::new(\"RustDesk\"|APP_NAME: RwLock<String> = RwLock::new(\"${APPNAME}\"|" "$CONFIG"
          grep -q "\"${SERVER}\"" "$CONFIG" || { echo "ERRO: servidor NAO aplicado"; exit 1; }
          grep -q "${PUBKEY}" "$CONFIG" || { echo "ERRO: chave publica NAO aplicada"; exit 1; }
          grep -q "APP_NAME: RwLock<String> = RwLock::new(\"${APPNAME}\"" "$CONFIG" || { echo "ERRO: APP_NAME NAO aplicado"; exit 1; }
          git -C libs/hbb_common apply --verbose --ignore-whitespace "${GITHUB_WORKSPACE}/simpview-patches/0001-hbb_common-forced-permanent-password.patch" \
            || { echo "ERRO: patch da senha forcada NAO aplicou"; exit 1; }
          grep -q "fn set_permanent_password_forced" "$CONFIG" || { echo "ERRO: set_permanent_password_forced ausente"; exit 1; }
          echo "OK: servidor ${SERVER}, chave, APP_NAME e patch da senha aplicados."

      - name: Android name & id (SIMP View)
        shell: bash
        run: |
          G=flutter/android/app/build.gradle
          M=flutter/android/app/src/main/AndroidManifest.xml
          sed -i "s|applicationId \"com.carriez.flutter_hbb\"|applicationId \"${APP_ID}\"|" "$G"
          sed -i "s|android:label=\"RustDesk\"|android:label=\"${APP_LABEL}\"|" "$M"
          sed -i "s|android:label=\"RustDesk Input\"|android:label=\"${APP_LABEL} - controle remoto\"|" "$M"
          grep -q "applicationId \"${APP_ID}\"" "$G" || { echo "ERRO: applicationId NAO aplicado"; exit 1; }
          grep -q "android:label=\"${APP_LABEL}\"" "$M" || { echo "ERRO: nome do app NAO aplicado"; exit 1; }
          echo "OK: ${APP_LABEL} (${APP_ID})"

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          [[ "3.24.5" == ${{env.ANDROID_FLUTTER_VERSION}} ]] && git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          if ! ./flutter/build_android_deps.sh "${{ matrix.job.abi }}"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do echo "$_1:"; cat "$_1"; echo ""; done
            exit 1
          fi

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: simpview-android
          key: ${{ matrix.job.target }}

      - name: Build rustdesk lib
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add ${{ matrix.job.target }}
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ./flutter/${{ matrix.job.ndk }}

      - name: Build APK
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          J=./flutter/android/app/src/main/jniLibs/${{ matrix.job.abi }}
          mkdir -p "$J"
          cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/${{ matrix.job.libcxx }}/libc++_shared.so "$J/"
          cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so "$J/librustdesk.so"
          pushd flutter
          # 18/11: o Maven Central devolveu 429 (Too Many Requests) ao baixar as
          # dependências do Gradle -- tenta de novo até 3 vezes, com espera.
          for t in 1 2 3; do
            flutter build apk --release --target-platform ${{ matrix.job.platform }} --split-per-abi && break
            [ "$t" = 3 ] && exit 1
            echo "::warning::build do APK falhou (tentativa $t); nova tentativa em $((t*60)) s"; sleep $((t*60))
          done
          popd
          mkdir -p signed-apk
          mv flutter/build/app/outputs/flutter-apk/app-${{ matrix.job.abi }}-release.apk signed-apk/SimpView-${{ env.VERSION }}-${{ matrix.job.arch }}.apk

      - name: Setup sign tool version variable
        shell: bash
        run: echo "ANDROID_SIGN_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)" >> $GITHUB_ENV

      - uses: r0adkll/sign-android-release@349ebdef58775b1e0d8099458af0816dc79b6407 # v1
        name: Sign APK (assinatura do SIMP View)
        id: assina
        with:
          releaseDirectory: ./signed-apk
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: ${{ env.ANDROID_SIGN_TOOL_VERSION }}

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SimpView-${{ env.VERSION }}-${{ matrix.job.arch }}.apk
          path: ${{ steps.assina.outputs.signedReleaseFile }}
          retention-days: 30
